{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finance | Peak Services</title>

    <link rel="stylesheet" href="{% static 'main/style.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="finance-page">

    <nav class="all-nav">
        <h2>Peak Services</h2>

        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'inventory' %}">Inventory</a>
            <a href="{% url 'logout' %}">Logout</a>
            <a href="{% url 'schedule' %}">Schedule</a>



        </div>
    </nav>

    <div class="finance-header">
        <div>
            <h1>Finance</h1>
            <p>Track your business income, expenses and profit</p>
        </div>

        <button class="finance-add-button" onclick="openFinanceForm()">
            + Add Transaction
        </button>
    </div>

    <!--Summary tables-->

    <div class="finance-summary">

        <div class="finance-card">
            <div class="finance-card-icon"> -></div>

            <div>
                <p>Total Income</p>
                <h2>${{ income|float format:2 }}</h2>

                <span> Income minus expenses </span>


            </div>
        </div>
    </div>

    <!--Charts-->

    <div class="finance-charts">

        <div class="finance-chart-card">
            <div class="finance-section-heading">

                <div>
                    <h2>Financial Overview</h2>
                    <p>Income compared with expenses</p>
                </div>
            </div>

            <div class="finance-chart-container">
                <canvas id="financeOverviewChart"></canvas>
            </div>
        </div>

        <div class="finance-chart-cardfinance-breakdown-card">

            <div class=""

        </div>
    </div>

</body>
</html>
