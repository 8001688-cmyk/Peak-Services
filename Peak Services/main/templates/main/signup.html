{% load static %}
<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <title>signup PS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="{% static 'main/style.css' %}" rel="stylesheet" />

</head>
<body>
    <div class="signup-page">

        <div class="signup-container">

            <div class="signup-card">

                <h1 class="signup-title"> Create Account </h1>

                <p class="signup-subtitle">Join Peak Services today.</p>

                <form method="POST" class="signup-form">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="signup-button">
                        Sign Up
                    </button>

                </form>

                <p class="signup-login"> Already have an account? 
                    
                    <a href="{% url 'login'%}" class="signup-login-link">Login</a></p>

            </div>
            </div>
    
   </div>
</body>
</html>
